  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const slot = 2.088;
      const panels = ["loop", "mark", "boost", "speed", "dim", "tint", "snap", "float"];
      const starts = [0, 2.088, 4.176, 6.264, 8.352, 10.44, 14.616, 16.704];
      const base = document.getElementById("t-demo").getBoundingClientRect();
      const positions = new Map();
      const point = (selector) => {
        if (positions.has(selector)) return positions.get(selector);
        const r = document.querySelector(selector).getBoundingClientRect();
        const p = { x: r.left - base.left + r.width / 2, y: r.top - base.top + r.height / 2 };
        positions.set(selector, p);
        return p;
      };
      ["#t-loop-handle", "#t-loop-handle-2", "#t-vivid-option", "#t-cinema-option", "#t-soft-option", "#t-mark-tool", "#t-marker", "#t-boost-tool", "#t-volume-handle", "#t-speed-meter", "#t-dim-tool", "#t-tint-tool", "#t-mono-option", "#t-snap-tool", "#t-float-tool"].forEach(point);
      const pointer = (name, target, at, offsetX = 0) => {
        const p = point(target), id = "#t-" + name + "-pointer";
        tl.fromTo(id, { x: p.x + 170, y: p.y + 65, opacity: 0 }, { x: p.x + offsetX, y: p.y, opacity: 1, duration: .24, ease: "power2.out" }, at);
        return { id, x: p.x + offsetX, y: p.y };
      };
      const click = (id, at) => {
        tl.to(id, { scale: .86, duration: .06, ease: "power2.out" }, at);
        tl.to(id, { scale: 1, duration: .1, ease: "power2.out" }, at + .06);
      };
      const show = (selector, at, duration = .14) => tl.to(selector, { opacity: 1, duration, ease: "power2.out" }, at);
      panels.forEach((name, i) => {
        const at = starts[i], panel = "#t-" + name;
        tl.set(panel, { opacity: 1 }, at);
        tl.fromTo(panel + " .headline", { opacity: 0, filter: "blur(7px)" }, { opacity: 1, filter: "blur(0px)", duration: .22, ease: "power2.out" }, at);
        show(panel + " .player-ui", at + .35);
        if (i < panels.length - 1) tl.set(panel, { opacity: 0 }, starts[i + 1]);
      });
      tl.fromTo("#t-loop .player", { y: 110, scale: .88, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: .3, ease: "expo.out" }, 0);

      // Two source intervals alternate, then playback returns to the first interval.
      pointer("loop", "#t-loop-handle", .36, -48);
      tl.fromTo("#t-loop-range", { opacity: 0, scaleX: .6 }, { opacity: 1, scaleX: 1, duration: .25, ease: "power2.inOut" }, .5);
      tl.to("#t-loop-pointer", { x: point("#t-loop-handle").x, duration: .25, ease: "power2.inOut" }, .5);
      const secondEnd = point("#t-loop-handle-2");
      tl.to("#t-loop-pointer", { x: secondEnd.x - 48, y: secondEnd.y, duration: .2, ease: "power2.inOut" }, .76);
      tl.fromTo("#t-loop-range-2", { opacity: 0, scaleX: .6 }, { opacity: 1, scaleX: 1, duration: .26, ease: "power2.inOut" }, .84);
      tl.to("#t-loop-pointer", { x: secondEnd.x, duration: .14, ease: "power2.inOut" }, .96);
      tl.fromTo("#t-loop-progress", { scaleX: .083333 }, { scaleX: .166667, duration: .5, ease: "none" }, 0);
      [[.5,.166667,.6],[1.1,.566667,.6],[1.7,.166667,.388]].forEach(([at,from,duration]) =>
        tl.fromTo("#t-loop-progress", { scaleX: from }, { scaleX: from + duration / 6, duration, ease: "none", immediateRender: false }, at));
      show("#t-loop-result", .85);

      // Save two different source moments, then revisit the first bookmark.
      const mark = slot;
      const markPointer = pointer("mark", "#t-mark-tool", mark + .1);
      click(markPointer.id, mark + .4);
      show("#t-marker", mark + .4);
      show("#t-bookmark-label", mark + .44);
      click(markPointer.id, mark + 1.1);
      show("#t-marker-2", mark + 1.1);
      tl.set("#t-bookmark-label", { opacity: 0 }, mark + 1.1);
      show("#t-bookmark-label-2", mark + 1.1);
      tl.fromTo("#t-mark-progress", { scaleX: .166667 }, { scaleX: .416667, duration: 1.5, ease: "none" }, mark);
