    <div data-hf-id="hf-c3or" class="hlw"><h1 data-hf-id="hf-shca" id="f-t2" class="hl">Never leave <span data-hf-id="hf-2hce" class="g">your work.</span></h1></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const reveal = (sel, at, d = 0.5) =>
        tl.fromTo(sel, { "--p": -18, opacity: 0, filter: "blur(10px)" }, { "--p": 100, opacity: 1, filter: "blur(0px)", duration: d, ease: "power2.out" }, at);
      const leave = (sel, at) =>
        tl.fromTo(sel, { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -18, filter: "blur(10px)", duration: 0.16, ease: "power2.in", immediateRender: false }, at);
      const typeLine = (id, at, step) => {
        const el = document.getElementById(id);
        const text = el.textContent;
        el.textContent = "";
        [...text].forEach((c, i) => {
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = c;
          el.appendChild(s);
          tl.set(s, { display: "inline" }, at + i * step);
        });
        return at + text.length * step;
      };
      const blink = (sel, from, to) => {
        for (let t = from; t + 0.5 < to; t += 1.0) {
          tl.set(sel, { opacity: 0 }, t);
          tl.set(sel, { opacity: 1 }, t + 0.5);
        }
      };

      // The film lands in the YouTube player; four work windows overlap its corners.
      tl.fromTo("#f-video", { borderRadius: "24px" }, { borderRadius: "12px", duration: 0.3, ease: "power2.out" }, 0.02);
      tl.fromTo("#f-chrome", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 0.02);
      tl.fromTo("#f-finder", { opacity: 0, x: -100, y: -35 }, { opacity: 1, x: 0, y: 0, duration: 0.55, ease: "expo.out" }, 0.12);
      tl.fromTo("#f-mail", { opacity: 0, x: 100, y: -35 }, { opacity: 1, x: 0, y: 0, duration: 0.55, ease: "expo.out" }, 0.17);
      tl.fromTo("#f-notes", { opacity: 0, x: -110, y: 35 }, { opacity: 1, x: 0, y: 0, duration: 0.55, ease: "expo.out" }, 0.2);
      tl.fromTo("#f-calendar", { opacity: 0, x: 100, y: 35 }, { opacity: 1, x: 0, y: 0, duration: 0.55, ease: "expo.out" }, 0.24);
      reveal("#f-t1", 0.1);
      leave("#f-t1", 2.2);
      reveal("#f-t2", 2.33);
      leave("#f-t2", 3.66);

      // Notes is focused and typing; the cursor never clicks the browser.
      const end1 = typeLine("f-typed1", 0.5, 0.032);
      blink("#f-caret1", end1 + 0.25, 2.45);
      tl.set("#f-caret1", { display: "none" }, 2.45);
      tl.set("#f-caret2", { display: "inline-block" }, 2.45);
      const end2 = typeLine("f-typed2", 2.48, 0.038);
      blink("#f-caret2", end2 + 0.2, 4.2);
      tl.fromTo("#f-cursor", { x: 0, y: 0 }, { x: -976, y: -527, duration: 0.42, ease: "expo.out" }, 0.62);

      // Scroll over the exposed video while Notes stays focused.
      tl.fromTo("#f-fingers", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" }, 1.1);
      tl.fromTo("#f-fingers", { x: 0 }, { x: -130, duration: .6, ease: "power2.inOut" }, 1.223);
      tl.to("#f-fingers", { x: 0, duration: .6, ease: "power2.inOut" }, 1.823);
      tl.to("#f-fingers", { opacity: 0, duration: 0.15, ease: "power2.in" }, 2.45);
      tl.fromTo("#f-bar", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, 1.05);
      tl.to("#f-bar", { opacity: 0, duration: 0.16, ease: "power2.in" }, 3.0);
      // The progress and the extracted video frames share exactly the same source-time map.
      tl.fromTo("#f-prog", { scaleX: .487317 }, { scaleX: .63, duration: 1.223, ease: "none" }, 0);
      tl.to("#f-prog", { scaleX: .4, duration: .6, ease: "power2.inOut" }, 1.223);
      tl.to("#f-prog", { scaleX: .77, duration: .6, ease: "power2.inOut" }, 1.823);
      tl.to("#f-prog", { scaleX: .974633, duration: 1.754, ease: "none" }, 2.423);

      // The native player counter follows the same source time as the picture and seek bar.
      [[0,"0:02 / 0:06"],[.108715,"0:03 / 0:06"],[1.5366,"0:02 / 0:06"],
       [2.0674,"0:03 / 0:06"],[2.1759,"0:04 / 0:06"],[2.96586,"0:05 / 0:06"]]
        .forEach(([at, textContent]) => tl.set("#f-time", { textContent }, at));

      // Out: the windows fall away and the seek bar flies up to become the speed scene's bar.
      tl.to(["#f-chrome", ".app-window", "#f-video", "#f-cursor"], { opacity: 0, duration: 0.28, ease: "power2.in" }, 3.74);
      tl.fromTo("#f-fly", { opacity: 0, x: 60, y: 219.25, scaleX: 0.683333, scaleY: 0.2143 }, { opacity: 1, duration: 0.06, ease: "none" }, 3.7);
      tl.to("#f-fly", { x: 0, y: 0, scaleX: 1, scaleY: 1, duration: 0.44, ease: "power3.inOut" }, 3.737);
      tl.fromTo(["#f-fly-fill", "#f-fly-orange"], { scaleX: 0.2188 }, { scaleX: 0.2188, duration: 0.01 }, 3.7);
      tl.fromTo("#f-fly-orange", { opacity: 1 }, { opacity: 0, duration: 0.36, ease: "power2.inOut" }, 3.76);

      window.__timelines["focus"] = tl;
    })();
  </script>
