<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Stage","default":"#F4F4FB"},
    {"id":"color-ink","type":"color","label":"Text","default":"#16161D"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#3D75FE"},
    {"id":"font-display","type":"string","label":"Display font","default":"BVC Inter"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Better Video Controls — launch film</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "BVC Inter";
        src: url("assets/fonts/inter-opsz.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      :root {
        --color-ground: #f4f4fb;
        --color-ink: #16161d;
        --color-accent: #3d75fe;
        --font-display: "BVC Inter";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: var(--font-display), sans-serif;
      }
      #backdrop {
        position: absolute;
        inset: 0;
        background: radial-gradient(110% 85% at 50% 42%, #ffffff 0%, #f4f4fb 62%, #ececf7 100%);
      }
    </style>
  </head>
  <body>
    <!-- Music at 115 BPM. The feature demonstration gives each action four beats. -->
    <div data-hf-id="hf-mpj7"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40.879"
      data-width="1920"
      data-height="1080"
      data-motion-blur="on"
    >
      <div data-hf-id="hf-o4la" id="backdrop" data-layout-ignore></div>

      <div data-hf-id="hf-5x3n" id="hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.177" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>

      <div data-hf-id="hf-awwg" id="tunnel" class="clip" data-composition-id="tunnel" data-composition-src="compositions/tunnel.html" data-start="10.442" data-duration="18.792" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 5"></div>
      <div data-hf-id="hf-n6td" id="settings" class="clip" data-composition-id="settings" data-composition-src="compositions/settings.html" data-start="29.234" data-duration="8.352" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 6"></div>
