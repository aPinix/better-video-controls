  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const show = (sel, at, d = 0.16) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power2.out" }, at);
      const hide = (sel, at, d = 0.14) => tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: d, ease: "power2.in", immediateRender: false }, at);

      // ---- Seek modes ----------------------------------------------------------------
      const wordsIn = (sel, at) =>
        tl.fromTo(`${sel} .w`, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.07, ease: "power2.out" }, at);
      const wordsOut = (sel, at) =>
        tl.fromTo(`${sel} .w`, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.14, stagger: 0.03, ease: "power2.in", immediateRender: false }, at);
      wordsIn("#s-t1", 0.42);
      wordsOut("#s-t1", 1.72);
      wordsIn("#s-t2", 1.86);
      wordsOut("#s-t2", 2.9);

      // Key caps: appear, press, hold while scrolling, release.
      tl.fromTo("#s-key-opt", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.16, ease: "expo.out" }, 0.3);
      tl.to("#s-key-opt", { y: 4, boxShadow: "0 0px 0 #c9c9cf, 0 6px 14px rgba(0,0,0,0.1)", duration: 0.06, ease: "power2.out" }, 0.46);
      tl.to("#s-key-opt", { y: 0, boxShadow: "0 4px 0 #c9c9cf, 0 12px 26px rgba(0,0,0,0.1)", duration: 0.08, ease: "power2.out" }, 1.32);
      tl.fromTo("#s-key-shift", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.16, ease: "expo.out" }, 1.7);
      tl.to(["#s-key-opt", "#s-key-shift"], { y: 4, boxShadow: "0 0px 0 #c9c9cf, 0 6px 14px rgba(0,0,0,0.1)", duration: 0.06, ease: "power2.out" }, 1.86);
      tl.to(["#s-key-opt", "#s-key-shift"], { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 2.92);

      // The extension's bar + labels. Progress follows capture/film-map.json "studio".
      show("#s-bar", 0.42, 0.15);
      tl.fromTo("#s-prog", { scaleX: 0.5208 }, { scaleX: 0.5375, duration: 0.5, ease: "none" }, 0);
      tl.to("#s-prog", { scaleX: 0.25, duration: 0.8, ease: "power3.out" }, 0.5);
      tl.to("#s-prog", { scaleX: 0.27, duration: 0.6, ease: "none" }, 1.3);
      tl.to("#s-prog", { scaleX: 0.2333, duration: 1.1, ease: "none" }, 1.9);
      tl.to("#s-prog", { scaleX: 0.3333, duration: 3.0, ease: "none" }, 3.0);
      tl.to("#s-prog", { scaleX: 0.4167, duration: 1.0, ease: "none" }, 6.0);
      tl.to("#s-prog", { scaleX: 0.5333, duration: 3.5, ease: "none" }, 7.0);
      show("#s-fast", 0.5, 0.1);
      hide("#s-fast", 1.36, 0.12);
      show("#s-slow", 1.9, 0.1);
      hide("#s-slow", 2.9, 0.12);

      // ---- Feature roll: one verb every two beats; "it." stays the same --------------
      const verbs = [
        ["#s-v-loop", 3.0],
        ["#s-v-mark", 4.0],
        ["#s-v-boost", 5.0],
        ["#s-v-speed", 6.0],
        ["#s-v-dim", 7.0],
        ["#s-v-tint", 8.0],
        ["#s-v-snap", 8.75],
        ["#s-v-float", 9.5],
      ];
      verbs.forEach(([sel, at], i) => {
        tl.fromTo(sel, { opacity: 0, yPercent: 55, filter: "blur(10px)" }, { opacity: 1, yPercent: 0, filter: "blur(0px)", duration: 0.24, ease: "expo.out" }, at);
        const next = verbs[i + 1] ? verbs[i + 1][1] - 0.05 : 10.28;
        tl.fromTo(sel, { opacity: 1, yPercent: 0, filter: "blur(0px)" }, { opacity: 0, yPercent: -55, filter: "blur(10px)", duration: 0.14, ease: "power2.in", immediateRender: false }, next);
      });

      // Loop: the timeline opens for editing, an A–B section is drawn, then it is saved on the bar.
      tl.fromTo("#s-edit", { opacity: 0, scaleY: 0.4 }, { opacity: 1, scaleY: 1, duration: 0.26, ease: "expo.out" }, 3.02);
      tl.fromTo("#s-edit-range", { clipPath: "inset(-6px 100% -6px 0px)" }, { clipPath: "inset(-6px 0% -6px 0px)", duration: 0.42, ease: "power3.out" }, 3.16);
      tl.fromTo("#s-h-end", { x: -312 }, { x: 0, duration: 0.42, ease: "power3.out" }, 3.16);
      tl.fromTo(["#s-h-start", "#s-h-end"], { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, 3.14);
      tl.to("#s-edit", { opacity: 0, scaleY: 0.4, duration: 0.16, ease: "power2.in" }, 3.82);
      show("#s-range", 3.86, 0.14);

      // Mark: a bookmark marker drops onto the bar.
      tl.fromTo("#s-marker", { opacity: 0, y: -46 }, { opacity: 1, y: 0, duration: 0.32, ease: "expo.out" }, 4.06);
      tl.fromTo("#s-mark-pill", { opacity: 0, y: 12, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.24, ease: "expo.out" }, 4.04);
      hide("#s-mark-pill", 4.93);

      // Boost: the volume pill fills past normal.
      tl.fromTo("#s-vol", { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.24, ease: "expo.out" }, 5.02);
      tl.fromTo("#s-vol-fill", { scaleY: 0.42 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 5.12);
      tl.fromTo("#s-boost-pill", { opacity: 0, x: 16, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.24, ease: "expo.out" }, 5.2);
      hide(["#s-vol", "#s-boost-pill"], 5.86);

      // Speed: the chip rolls 1× → 1.5× → 2× and the film runs at 2× (baked).
      show("#s-speed", 6.02, 0.14);
      const roll = (outSel, inSel, at) => {
        tl.fromTo(outSel, { yPercent: 0, opacity: 1 }, { yPercent: -100, opacity: 0, duration: 0.1, ease: "power2.in", immediateRender: false }, at);
        tl.fromTo(inSel, { yPercent: 100, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.14, ease: "expo.out" }, at + 0.04);
      };
      tl.set(["#s-sp2", "#s-sp3", "#s-f2"], { opacity: 0 }, 0);
      roll("#s-sp1", "#s-sp2", 6.14);
      roll("#s-sp2", "#s-sp3", 6.3);
      hide("#s-speed", 6.88);

      // Dim: Cinema Mode turns the page around the video to black.
      tl.fromTo("#s-dark", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 7.0);
      tl.fromTo(".verb", { color: "#1d1d1f" }, { color: "#f5f5f7", duration: 0.4, ease: "power2.inOut", immediateRender: false }, 7.0);

      // Tint: filter presets Vivid, then Mono (baked into the footage at the same times).
      show("#s-filter", 8.0, 0.12);
      roll("#s-f1", "#s-f2", 8.33);
      hide("#s-filter", 8.68, 0.1);

      // Snap: screenshot flash and the extension's confirmation.
      tl.fromTo("#s-flash", { opacity: 0 }, { opacity: 0.85, duration: 0.03, ease: "none" }, 8.75);
      tl.to("#s-flash", { opacity: 0, duration: 0.22, ease: "power2.out" }, 8.78);
