  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Typing: split each typed note line into characters; each one appears in turn.
      const typeLine = (id, at, step) => {
        const el = document.getElementById(id);
        const text = el.textContent;
        el.textContent = "";
        [...text].forEach((c, i) => {
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = c;
          el.appendChild(s);
          tl.set(s, { display: "inline" }, at + i * step);
        });
        return at + text.length * step;
      };
      const blink = (sel, from, to) => {
        for (let t = from; t + 0.5 < to; t += 1.0) {
          tl.set(sel, { opacity: 0 }, t);
          tl.set(sel, { opacity: 1 }, t + 0.5);
        }
      };
      typeLine("d-typed", 0.3, 0.037);
      blink("#d-caret", 1.9, 3.7);
      // Right after the rewind the person keeps typing: Notes never lost focus.
      tl.set("#d-caret", { display: "none" }, 3.7);
      tl.set("#d-caret2", { display: "inline-block" }, 3.7);
      const typedEnd = typeLine("d-typed2", 3.72, 0.045);
      blink("#d-caret2", typedEnd + 0.3, 5.5);

      // Titles: per-word blur in, blur out.
      const wordsIn = (sel, at) =>
        tl.fromTo(`${sel} .w`, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.07, ease: "power2.out" }, at);
      const wordsOut = (sel, at) =>
        tl.fromTo(`${sel} .w`, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.15, stagger: 0.03, ease: "power2.in", immediateRender: false }, at);
      wordsIn("#d-l1", 0.2);
      wordsOut("#d-l1", 1.78);
      wordsIn("#d-l2", 1.95);
      wordsOut("#d-l2", 3.5);
      wordsIn("#d-l3", 3.65);
      wordsOut("#d-l3", 5.12);

      // Cursor enters from off-screen and lands on the video. It never clicks.
      tl.fromTo("#d-cursor", { x: 0, y: 0 }, { x: -786, y: -477, duration: 0.75, ease: "expo.out" }, 1.4);

      // Two fingers scroll sideways; the extension's seek bar shows and the film rewinds.
      tl.fromTo("#d-fingers", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" }, 2.18);
      tl.fromTo("#d-fingers", { x: 0 }, { x: -120, duration: 1.2, ease: "power2.inOut" }, 2.3);
      tl.to("#d-fingers", { opacity: 0, duration: 0.2, ease: "power2.in" }, 3.5);
      tl.fromTo("#d-bar", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 2.2);
      // Progress = (source time - 380) / 24, the same segments as capture/film-map.json "desktop".
      tl.fromTo("#d-prog", { scaleX: 0.7625 }, { scaleX: 0.4375, duration: 1.2, ease: "power2.inOut" }, 2.3);
      tl.to("#d-prog", { scaleX: 0.4542, duration: 0.4, ease: "none" }, 3.5);
      tl.to("#d-bar", { opacity: 0, duration: 0.2, ease: "power2.in" }, 3.75);

      // Glide onto the film: everything else falls away and the film settles into the studio player.
      tl.to("#d-cursor", { opacity: 0, duration: 0.15, ease: "power2.in" }, 4.68);
      tl.to("#d-notes", { opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 4.7);
      // Lands the film exactly on the studio player rect: (288, 236), 1344 x 756.
      tl.fromTo("#d-cam", { scale: 1, x: 0, y: 0 }, { scale: 1.2, x: -480, y: -152.8, duration: 0.7, ease: "power2.inOut" }, 4.7);
      tl.fromTo("#d-fill", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.inOut" }, 4.75);
      tl.fromTo(
        "#d-video",
        { borderRadius: "0px 0px 14px 14px", boxShadow: "0 33px 75px rgba(0,0,0,0)" },
        { borderRadius: "23.33px 23.33px 23.33px 23.33px", boxShadow: "0 33px 75px rgba(0,0,0,0.22)", duration: 0.7, ease: "power2.inOut" },
        4.7,
      );

      window.__timelines["desktop"] = tl;
    })();
  </script>
